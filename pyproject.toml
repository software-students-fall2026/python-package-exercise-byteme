[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "byteme-tarot"
version = "0.1.1"
description = "A lighthearted Python tarot reading package"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [
    {name = "Tracy Wang"},
    {name = "Emma Ao"},
    {name = "Jingjing Wang"},
    {name = "Uuriintuya Ganzorig"},
]
dependencies = []

[project.urls]
Homepage = "https://github.com/software-students-fall2026/python-package-exercise-byteme"
Repository = "https://github.com/software-students-fall2026/python-package-exercise-byteme"
Issues = "https://github.com/software-students-fall2026/python-package-exercise-byteme/issues"

[tool.setuptools.packages.find]
where = ["src"]
